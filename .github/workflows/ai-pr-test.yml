name: AI PR Quality Gate & Test Automation

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  test_and_verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          if [ -f "backend/package.json" ]; then
            echo "📦 Cài đặt thư viện Backend..."
            cd backend && npm install && cd ..
          fi
          if [ -f "frontend/package.json" ]; then
            echo "📦 Cài đặt thư viện Frontend..."
            cd frontend && npm install && cd ..
          fi

      - name: Run Backend Tests
        id: test_backend
        run: |
          if [ -f "backend/package.json" ]; then
            cd backend
            npm test 2>&1 | tee ../backend_test.log
          else
            echo "Không có backend/package.json, bỏ qua backend tests."
          fi
        continue-on-error: true

      - name: Run Frontend Tests & Build
        id: build_frontend
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm test 2>&1 | tee ../frontend_test.log || true
            npm run build 2>&1 | tee ../frontend_build.log
          else
            echo "Không có frontend/package.json, bỏ qua frontend tests & build."
          fi
        continue-on-error: true

      - name: AI Quality Gate & Scope Verification
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL || 'https://cotuong69.atlassian.net' }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.head_ref || github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BACKEND_OUTCOME: ${{ steps.test_backend.outcome }}
          FRONTEND_OUTCOME: ${{ steps.build_frontend.outcome }}
        run: python3 .github/scripts/ai_pr_tester.py
